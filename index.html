<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <h1>🐹 Whack-a-Mole!</h1>
            <p>Catch the mole before it disappears!</p>
        </header>

        <section class="game-info">
            <div class="score">
                <h3>Score</h3>
                <p id="score">0</p>
            </div>

            <div class="time score">
                <h3 id="timer-head">Time</h3>
                <p id="timer">30</p>
            </div>
        </section>

        <section class="game-board">

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

            <div class="hole">
                <img src="mole.svg" class="mole" alt="Mole">
            </div>

        </section>

        <button id="start-btn">Start Game</button>


    </main>
    <div class="signature">
        <span>✦</span>
        Mishal Singh
        <span>✧</span>
    </div>

    <script src="script.js"></script>

</body>

</html>
